<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="40%" stop-color="#A78BFA"/>
      <stop offset="70%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Cross-platform Compatible Filters -->
    <filter id="blur-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>

    <filter id="glow-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feFlood flood-color="#8B5CF6" flood-opacity="0.5"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes pulseOrb {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 400; opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      .pill-float-1 { animation: floatSlow1 7s ease-in-out infinite; }
      .pill-float-2 { animation: floatSlow2 8.5s ease-in-out infinite; }
      .pill-float-3 { animation: floatSlow3 6s ease-in-out infinite; }
      .orb-pulse { animation: pulseOrb 9s ease-in-out infinite; }
      .data-stream { stroke-dasharray: 20 40; animation: pulseBeam 5s linear infinite; }
      .data-stream-rev { stroke-dasharray: 15 35; animation: pulseBeam 6s linear infinite reverse; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Futuristic Grid Pattern -->
  <g opacity="0.12" stroke="#60A5FA" stroke-width="0.75">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="840" y1="0" x2="840" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1080" y1="0" x2="1080" y2="360"/>
  </g>

  <!-- Ambient Animated Glowing Nebulae (Deep Background) -->
  <g class="orb-pulse">
    <circle cx="180" cy="90" r="140" fill="url(#glow-cyan)" filter="url(#blur-lg)"/>
    <circle cx="1020" cy="110" r="150" fill="url(#glow-purple)" filter="url(#blur-lg)"/>
    <circle cx="600" cy="300" r="160" fill="url(#glow-pink)" filter="url(#blur-lg)"/>
  </g>

  <!-- Network Circuit Lines (Deep Background) -->
  <g opacity="0.35" fill="none">
    <path class="data-stream" d="M 60 70 Q 250 20 420 80 T 800 50 T 1140 90" stroke="#38BDF8" stroke-width="1.8"/>
    <path class="data-stream-rev" d="M 50 290 Q 300 340 580 280 T 920 310 T 1150 270" stroke="#A78BFA" stroke-width="1.8"/>
    <path class="data-stream" d="M 150 320 Q 200 150 380 120 T 750 220 T 1050 70" stroke="#F472B6" stroke-width="1.2"/>
  </g>

  <!-- Floating Dynamic Tech Cards / Badges (Layered behind central text) -->
  <!-- Top Left Pill -->
  <g class="pill-float-1" transform="translate(65, 38)">
    <rect width="185" height="34" rx="17" fill="#1E293B" fill-opacity="0.65" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="22" cy="17" r="5" fill="#38BDF8"/>
    <text x="36" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Autonomous SDRs</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="pill-float-2" transform="translate(75, 290)">
    <rect width="210" height="34" rx="17" fill="#1E293B" fill-opacity="0.65" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="22" cy="17" r="5" fill="#A78BFA"/>
    <text x="36" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">AI Software Engineers</text>
  </g>

  <!-- Top Right Pill -->
  <g class="pill-float-3" transform="translate(945, 45)">
    <rect width="195" height="34" rx="17" fill="#1E293B" fill-opacity="0.65" stroke="#F472B6" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="22" cy="17" r="5" fill="#F472B6"/>
    <text x="36" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Multi-Agent Swarms</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="pill-float-1" transform="translate(930, 285)">
    <rect width="205" height="34" rx="17" fill="#1E293B" fill-opacity="0.65" stroke="#34D399" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="22" cy="17" r="5" fill="#34D399"/>
    <text x="36" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Voice Telephony AI</text>
  </g>

  <!-- Constellation Nodes -->
  <g opacity="0.6">
    <circle cx="280" cy="65" r="3" fill="#60A5FA"/>
    <circle cx="890" cy="78" r="3" fill="#A78BFA"/>
    <circle cx="340" cy="305" r="3" fill="#F472B6"/>
    <circle cx="860" cy="295" r="3" fill="#34D399"/>
  </g>

  <!-- Outer Glass Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- ================= FOREGROUND HERO CONTENT ================= -->
  <!-- Layered at the very top of the DOM to guarantee 100% foreground clarity and visibility -->
  <g id="foreground">
    <!-- Category Pill -->
    <g transform="translate(450, 48)">
      <rect width="300" height="32" rx="16" fill="#1E293B" fill-opacity="0.85" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="150" y="21" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">
        ⚡ CURATED ECOSYSTEM &amp; DIRECTORY
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#title-grad)" filter="url(#glow-shadow)">
      AWESOME VIRTUAL AI COLLEAGUES
    </text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="600" fill="#F1F5F9">
      Autonomous Digital Workers &#8226; Multi-Agent Workflows &#8226; Business Process Execution
    </text>

    <!-- Subtitle Line 2 -->
    <text x="600" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">
      Leading SaaS Platforms &amp; Self-Hosted Open-Source Frameworks for the Modern AI Workforce
    </text>

    <!-- Bottom Feature Badges / Highlights -->
    <g transform="translate(330, 266)">
      <!-- Badge 1: Production Ready -->
      <g transform="translate(0, 0)">
        <rect width="160" height="28" rx="14" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="80" y="18" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🚀 Production Deployed</text>
      </g>
      <!-- Badge 2: Open Source -->
      <g transform="translate(180, 0)">
        <rect width="180" height="28" rx="14" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="90" y="18" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🔓 100% Data Sovereign</text>
      </g>
      <!-- Badge 3: Multi-Agent -->
      <g transform="translate(380, 0)">
        <rect width="160" height="28" rx="14" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="80" y="18" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🤖 Multi-Agent Orchestration</text>
      </g>
    </g>
  </g>
</svg>
